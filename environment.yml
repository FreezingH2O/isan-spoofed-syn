name: isan-spoofed
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Audio & ML — install via conda for proper native libs & CUDA linking
  - pytorch>=2.1.0
  - torchaudio>=2.1.0
  - pytorch-cuda=11.8   # remove this line if running CPU-only
  - numpy>=1.26.0
  - scipy>=1.12.0
  - librosa>=0.10.1
  - pysoundfile>=0.12.1
  - ffmpeg                # required by pydub for audio format conversion

  # Utilities available on conda-forge
  - pyyaml>=6.0.1
  - tqdm>=4.66.0
  - requests>=2.31.0

  - pip:
    # HuggingFace ecosystem
    - datasets>=2.18.0
    - huggingface-hub>=0.21.0

    # TTS API client (OpenAI-compatible endpoint)
    - openai>=1.0.0

    # CLI & logging
    - loguru>=0.7.2
    - click>=8.1.7
    - rich>=13.7.0

    # Audio
    - pydub>=0.25.1
    - openpyxl>=3.1.0

    # Phase 6 enhancer — surgical HiFi-GAN artifact removal, preserves VC fingerprints
    - deepfilternet>=0.5.6

    # Phase 6 alternative enhancer (optional — full neural speech restoration)
    # Uncomment to install:
    # - resemble-enhance>=0.0.2

    # NOTE: Phase 3 denoising requires UVR CLI — NOT pip-installable.
    # Download the standalone binary from:
    #   https://github.com/Anjok07/ultimatevocalremovergui
    # Place the executable (uvr or uvr-cli) on your PATH.
    # If UVR is missing, Phase 3 will skip denoising and use raw audio.

    # Install this project itself in editable mode
    - -e .

    # Dev tools (remove if not developing)
    - pytest>=8.0.0
    - pytest-cov>=5.0.0
    - ruff>=0.4.0
    - mypy>=1.9.0
